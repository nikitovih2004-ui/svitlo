<style>
body{margin:0;background:#0d1015;color:#eef1f5;font:14px/1.3 system-ui,sans-serif;font-variant-numeric:tabular-nums}
#w{padding:14px 14px 13px}
.z{margin:0 0 10px;padding:7px 10px;border-radius:10px;background:#2b2210;color:#ffb020;font-size:13px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hd b{font-size:20px;letter-spacing:-.3px}
.hd span{font-size:12px;color:#7d8696;white-space:nowrap}
svg{display:block;width:100%;max-width:340px;margin:10px auto 4px}
.k{font-size:11px;letter-spacing:.7px;text-transform:uppercase;fill:#8f98a8;color:#7d8696}
.v{font-size:20px;font-weight:700;letter-spacing:-.5px}
.s{font-size:10.5px;fill:#9aa3b2}
.e{font-size:11.5px;font-weight:600}
.r{display:flex;gap:10px;padding:7px 0;border-top:1px solid #1c222b;font-size:14px}
.r>span:first-child{width:66px;flex:none;color:#7d8696;font-size:13px}
.r em{font-style:normal;color:#9aa3b2;font-size:13px}
.lo{color:#ff5d4a}
.q{display:flex;gap:6px;margin-top:6px}
.q div{flex:1;min-width:0;padding:7px 8px;border-radius:10px;background:#161b22}
.q b{display:block;font-size:18px;letter-spacing:-.4px}
.q span{font-size:11px;color:#8f98a8;white-space:nowrap}
</style>
<div id="w"></div>
<script>
(()=>{const W=window.TelegramWidget,E=document.getElementById('w'),
P=n=>(n<10?'0':'')+n,
M=m=>(m=(m%1440+1440)%1440,P(m/60|0)+':'+P(m%60|0)),
F=(x,k)=>(+x).toFixed(k).replace('.',',').replace('-','−'),
A=s=>s<5400?Math.round(s/60)+' мин':'~'+Math.round(s/3600)+' ч',
G=s=>s<90?Math.round(s)+' с':s<5400?Math.round(s/60)+' мин':Math.round(s/3600)+' ч',
X=(x,y,r)=>`<path d="M${x} ${y}${['l-5-5v10z','l5-5v10z','l-5-5h10z'][r]}" fill="#eef1f5"/>`;
function R(){let d;try{d=JSON.parse(W.chatData)}catch(e){}
if(!d)return;
const t=Date.now()/1e3,T=u=>M((u-d.d)/60),age=t-d.t,old=age>300,g=d.g,
gc=old?'#5b6370':g?'#3ddc84':'#ff5d4a',
in_=!old&&g&&d.n>20,out=!old&&g&&d.n<-20,ch=!old&&d.b<-20,dis=!old&&d.b>20,ld=!old&&d.l>0,
L=(a,b,c,on)=>`<path d="M${a}" stroke="${on?c:'#2a313b'}" stroke-width="2.5"${on?'':' stroke-dasharray="3 4"'} fill="none"/>`,
N=(x,y,k,v,s,c)=>`<rect x="${x}" y="${y}" width="82" height="70" rx="12" fill="#161b22" stroke="${c}" stroke-width="2"/><text x="${x+41}" y="${y+20}" text-anchor="middle" class="k">${k}</text><text x="${x+41}" y="${y+44}" text-anchor="middle" class="v" fill="${c=='#2a313b'?'#eef1f5':c}">${v}</text><text x="${x+41}" y="${y+60}" text-anchor="middle" class="s">${s}</text>`,
m=!g&&d.e>t?d.e-t:d.h,lo=d.c<20,cc=lo?'#ff5d4a':'#eef1f5',q=d.q||[];
E.innerHTML=(old?d.z&&t>d.z?`<div class="z" style="background:#161b22;color:#9aa3b2">Снимок на ${T(d.t)} · свежие данные — кнопка «Инвертор»</div>`:`<div class="z">Нет связи с инвертором · данные на ${T(d.t)}</div>`:'')+
`<div class="hd"><b>Инвертор</b><span>${old?'<b style="font-size:12px;color:'+(d.z&&t>d.z?'#9aa3b2':'#ffb020')+'">'+G(age)+' назад</b>':'обновлено '+G(age)+' назад · '+T(d.t)}</span></div>
<svg viewBox="0 0 300 186">
${L('82 42H141',0,'#3ddc84',in_||out)+L('159 42H218',0,'#eef1f5',ld)+L('150 51V114',0,'#eef1f5',ch||dis)}
${in_?X(130,42,0):out?X(94,42,1):''}${ld?X(200,42,0):''}${ch?X(150,106,2):dis?`<path d="M150 62l-5 5h10z" fill="#eef1f5"/>`:''}
<circle cx="150" cy="42" r="9" fill="#0d1015" stroke="#eef1f5" stroke-width="2.5"/>
<text x="144" y="66" text-anchor="end" class="s">инвертор</text>
${in_||out?`<text x="111" y="33" text-anchor="middle" class="e" fill="#3ddc84">${Math.abs(d.n)} Вт</text>`:''}
${ch||dis?`<text x="158" y="91" class="e" fill="#eef1f5">${ch?'заряд':'разряд'} ${Math.abs(d.b)} Вт</text>`:''}
${N(0,7,"Сеть",g?Math.round(d.u)+" В":'нет',g?(out?'отдаём в сеть':in_?'берём из сети':d.f?F(d.f,2)+' Гц':'есть'):'отключена',gc)}
${N(218,7,'Дом',d.l+' Вт','нагрузка','#2a313b')}
<rect x="109" y="114" width="82" height="70" rx="12" fill="#161b22" stroke="#2a313b" stroke-width="2"/>
<text x="150" y="134" text-anchor="middle" class="k">Батарея</text>
<text x="150" y="158" text-anchor="middle" class="v" fill="${cc}">${d.c} %</text>
<rect x="121" y="168" width="58" height="5" rx="2.5" fill="#262c35"/><rect x="121" y="168" width="${.58*d.c}" height="5" rx="2.5" fill="${cc}"/><rect x="${120+.58*d.x}" y="165" width="2" height="11" fill="#ff5d4a"/>
</svg>
<div class="r"><span>Батарея</span><div>${F(d.v,1)} В · ${F(Math.abs(d.a),1)} А · ${F(d.k,1)} °C<br><em${lo?' class="lo"':''}>${m>0?(g?'без сети хватит на ':'хватит на ')+A(m):''}${d.c<d.x+15||!(m>0)?'<br>отключится при '+d.x+' %':''}${d.b<-20&&d.e>t?'<br>полная к '+T(d.e):''}</em></div></div>
<div class="r"><span>Сеть</span><div>${g?F(d.u,1)+' В'+(d.f?' · '+F(d.f,2)+' Гц':''):'<span class="lo">нет напряжения</span>'}${g&&d.n?'<br><em>'+(d.n>0?'из сети ':'в сеть ')+Math.abs(d.n)+' Вт</em>':''}</div></div>
${d.i?`<div class="r"><span>Инвертор</span><div>${F(d.i,1)} °C</div></div>`:''}
${q.length?`<div class="r" style="padding-bottom:0"><span style="width:auto">За сегодня, кВт·ч</span></div><div class="q">${[[3,'потребили'],[2,'из сети'],[0,'заряд'],[1,'разряд']].map(([j,s])=>`<div><b>${F(q[j],1)}</b><span>${s}</span></div>`).join('')}</div>`:''}`}
W.onEvent('chatDataChanged',R);setInterval(R,1e4);R()})()
</script>
