<style>
body{margin:0;background:#0d1015;color:#eef1f5;font:14px/1.3 system-ui,sans-serif;font-variant-numeric:tabular-nums;--a:#3ddc84;--t:#10261a}
.f{--a:#ff5d4a;--t:#2a1311}
#w{padding:14px 14px 13px}
.k{color:#7d8696}
.z{margin:0 0 10px;padding:7px 10px;border-radius:10px;background:#2b2210;color:#ffb020;font-size:13px}
.h{padding:12px 14px 13px;border-radius:16px;background:var(--t)}
.st{display:flex;align-items:center;gap:9px;font-size:24px;font-weight:700;letter-spacing:-.4px}
.st i{width:11px;height:11px;border-radius:6px;background:var(--a);flex:none}
.st span{margin-left:auto;font-size:13px;font-weight:400;letter-spacing:0;color:#9aa3b2}
.n{display:flex;align-items:flex-end;gap:12px;margin-top:9px}
.n b{font-size:46px;line-height:.95;letter-spacing:-1.6px;color:var(--c,#eef1f5)}
.n b.w{font-size:26px;line-height:1.1;letter-spacing:-.5px}
.n div{font-size:14px;color:#c4cad4;padding-bottom:2px}
.q{font-size:13px;color:#9aa3b2;margin-top:8px}
.y{--c:#ffb020}
.g{display:flex;gap:10px;margin:14px 0 4px}
.g>div{flex:1;min-width:0}
.cp{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:#7d8696;margin:0 0 6px;white-space:nowrap}
.cp u{text-decoration:none;color:#c4cad4}
.r{font-size:17px;font-weight:600;padding:5px 0 5px 9px;margin:0 0 4px;border-left:3px solid #ff5d4a;border-radius:3px;white-space:nowrap}
.r.p{color:#4f5763;border-color:#43292a;font-weight:500}
.r.c{background:#ff5d4a;color:#160807;border-color:#ff5d4a;border-radius:7px}
.r.c.y{background:#ffb020;border-color:#ffb020}
.e{font-size:14px;padding:5px 0 5px 9px;border-left:3px solid #2f7a52;color:#3ddc84}
.u{font-size:13px;line-height:1.35;padding:6px 9px;border:1px dashed #3a414c;border-radius:8px;color:#8f98a8}
.u.ae{border-color:#6b4e12;color:#ffb020}
.b{display:flex;align-items:center;gap:10px;margin-top:12px}
.b b{font-size:22px;letter-spacing:-.5px}
.t{flex:1;height:8px;border-radius:4px;background:#1c222b}
.t div{height:8px;border-radius:4px;background:#cfd6e0}
.lo b,.lo .x{color:#ff5d4a}
.lo .t div{background:#ff5d4a}
.m{display:flex;justify-content:space-between;gap:10px;margin-top:5px;font-size:13px;color:#9aa3b2}
.m span:last-child{text-align:right;white-space:nowrap}
</style>
<div id="w"></div>
<script>
(()=>{const W=window.TelegramWidget,E=document.getElementById('w'),
P=n=>(n<10?'0':'')+n,
M=m=>m==1440?'24:00':(m=(m%1440+1440)%1440,P(m/60|0)+':'+P(m%60|0)),
D=s=>(s=Math.max(1,Math.round(s/60)),s<60?s+' мин':(s/60|0)+' ч'+(s%60?' '+s%60+' мин':'')),
A=s=>s<5400?Math.round(s/60)+' мин':'~'+Math.round(s/3600)+' ч',
N='вс пн вт ср чт пт сб'.split(' ');
function R(){let d;try{d=JSON.parse(W.chatData)}catch(e){}
if(!d)return;
const t=Date.now()/1e3,n=(t-d.d)/60,g=d.g,K=Math.floor(n/1440),z=K*1440,Z=d.w?2880:1440,
o=n<Z?(d.o||[]).filter(v=>v[0]<Z):[],
cur=o.find(v=>v[0]<=n&&n<v[1]),nx=o.find(v=>v[0]>n),
T=u=>M((u-d.d)/60),H=v=>M(v-z),X=v=>v-z>1440?'завтра ':'',
Y=k=>{const x=new Date((d.d+k*86400+43200)*1e3);return N[x.getUTCDay()]+' '+P(x.getUTCDate())+'.'+P(x.getUTCMonth()+1)},
S=u=>t-u>8e4?Y(Math.floor((u-d.d)/86400)):T(u),
L=(k,q)=>{const a=z+k*1440;let h=`<div><div class="cp">${q} · <u>${Y(K+k)}</u></div>`;
if(d.m>>K+k&1)return h+'<div class="u ae">аварийные отключения, график не действует</div></div>';
if(a+1440>Z)return h+'<div class="u">график ещё не опубликован</div></div>';
const v=o.filter(v=>v[1]>a&&v[0]<a+1440);
return h+(v.map(v=>{const b=Math.max(v[0],a),c=Math.min(v[1],a+1440);
return`<div class="r${c<=n?' p':b<=n?' c'+(g?' y':''):''}">${M(b-a)}–${M(c-a)}</div>`}).join('')||'<div class="e">отключений нет</div>')+'</div>'};
let q,b,s='',y='';
if(!g&&cur)q=X(cur[1])+'включат в',b=H(cur[1]),s='через<br>'+D((cur[1]-n)*60);
else if(!g)q='отключили вне графика в',b=T(d.s),s='уже '+D(t-d.s)+'<br>когда дадут — неизвестно';
else if(d.m>>K&1)q='аварийные отключения',b='график не действует',s='',y=' w';
else if(cur)q='по графику света нет до',b=H(cur[1]),s='но свет<br>пока есть',y=' y';
else if(nx)q=X(nx[0])+'отключат в',b=H(nx[0]),s='через '+D((nx[0]-n)*60)+'<br>до '+H(nx[1]);
else q=Z-n>1440?'до конца завтра':'до конца суток',b='без отключений',s='',y=' w';
const m=!g&&d.e>t?d.e-t:d.h,lo=d.c<20;
document.body.className=g?'':'f';
E.innerHTML=(t-d.t>300?`<div class="z">Нет связи с инвертором · данные на ${T(d.t)}</div>`:'')+
`<div class="h"><div class="st"><i></i>${g?'Свет есть':'Света нет'}<span>с ${S(d.s)}</span></div>
<div class="q">${q}</div><div class="n${y==' y'?y:''}"><b class="${y==' w'?'w':''}">${b}</b><div>${s}</div></div></div>
<div class="g">${L(0,'Сегодня')+L(1,'Завтра')}</div>
<div class="b${lo?' lo':''}"><b>${d.c}%</b><div class="t"><div style="width:${d.c}%"></div></div></div>
<div class="m${lo?' lo':''}"><span class="x">${m>0?(g?'без сети хватит на ':'хватит на ')+A(m):d.c>98?'батарея полная':''}${d.b<-50&&d.e>t?'<br>полная к '+T(d.e):''}</span><span>${d.l} Вт${g&&d.u?'<br>сеть '+d.u+' В':''}</span></div>`}
W.onEvent('chatDataChanged',R);setInterval(R,2e4);R()})()
</script>
